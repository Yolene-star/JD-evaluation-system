<style>
  .demo{width:min(620px,100%);margin:auto;background:#f7f9f8;color:#233430;border:1px solid #dce7e3;border-radius:14px;padding:22px;font-family:Inter,system-ui,"Microsoft YaHei",sans-serif;box-sizing:border-box}.label{font-size:13px;font-weight:700;margin-bottom:10px}.option{display:grid;grid-template-columns:20px 1fr;gap:10px;background:#fff;border:1px solid #dde9e5;border-radius:9px;padding:13px 14px;margin:8px 0}.option.selected{border:2px solid #278b7d;padding:12px 13px;background:#f0f8f5}.radio{width:16px;height:16px;border:1.5px solid #aabdb7;border-radius:50%;margin-top:2px;box-sizing:border-box}.selected .radio{border:5px solid #238b7b}.title{font-size:13px;font-weight:700;line-height:1.4}.desc{font-size:11px;color:#71817c;line-height:1.55;margin-top:4px}.edit-row{display:flex;gap:8px;align-items:center;margin-top:11px;padding-top:10px;border-top:1px solid #e5efeb}.input{flex:1;min-width:0;border:1px solid #cdded8;background:#fff;border-radius:7px;padding:9px 10px;color:#354d46;font-size:11px;box-sizing:border-box}.edit{border:0;background:#e5efeb;color:#39625a;border-radius:7px;padding:9px 11px;font-size:11px;white-space:nowrap;cursor:pointer}.tip{margin-top:14px;color:#7b8985;font-size:10px}

.edit-row .input,
.edit-row .edit { height:36px; box-sizing:border-box; }
.edit-row .input { padding-top:0; padding-bottom:0; padding-left:12px; padding-right:12px; font-size:13px; line-height:36px; }
.edit-row .edit { padding-top:0; padding-bottom:0; padding-left:14px; padding-right:14px; font-size:12px; }

<div class="demo">
  <div class="label">请选择处理方式</div>
